<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚餐吃什麼 - 簡潔版</title>
    <!-- 引入思源黑體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F5F7FA;
            --text-color: #2C3E50;
            --card-bg: #FFFFFF;
            --primary-color: #4A90E2;
            --primary-hover: #357ABD;
            --border-color: #E2E8F0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Sans TC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h1 {
            font-weight: 700; font-size: 2rem; margin-bottom: 30px; letter-spacing: 1px;
        }

        .control-panel {
            background: var(--card-bg); padding: 24px; border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); display: flex; gap: 20px;
            margin-bottom: 24px; flex-wrap: wrap; justify-content: center;
            border: 1px solid var(--border-color);
        }

        .control-group { display: flex; align-items: center; gap: 10px; }

        input, select {
            background-color: #F8FAFC; color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 8px;
            font-family: 'Noto Sans TC', sans-serif; font-size: 1rem;
            padding: 10px 16px; outline: none;
        }

        button.action-btn {
            background-color: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 8px;
            font-family: 'Noto Sans TC', sans-serif; font-size: 1rem;
            padding: 10px 16px; cursor: pointer;
        }
        button.action-btn:hover { background-color: #E2E8F0; }

        .data-display {
            color: #64748B; margin-bottom: 30px; font-size: 0.95rem;
        }

        #wheel-container {
            position: relative; width: 380px; height: 380px; margin-top: 20px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.08));
        }

        #wheelCanvas {
            width: 100%; height: 100%; border-radius: 50%;
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.2, 1);
            background-color: var(--card-bg);
        }

        #pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 30px solid var(--text-color); z-index: 10;
        }

        button.spin-btn {
            padding: 14px 40px; font-size: 1.2rem; font-weight: 700;
            background-color: var(--primary-color); color: #fff; border: none;
            border-radius: 50px; cursor: pointer; margin-top: 10px;
            font-family: 'Noto Sans TC', sans-serif; box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }
        button.spin-btn:hover { background-color: var(--primary-hover); }

        #resultText {
            margin-top: 40px; font-size: 1.5rem; font-weight: 700;
            color: var(--text-color); text-align: center; min-height: 40px;
        }
    </style>
</head>
<body>

    <h1>晚餐吃什麼</h1>

    <div class="control-panel">
        <div class="control-group">
            <input type="text" id="newOptionInput" placeholder="新增選項...">
            <button class="action-btn" onclick="addOption()">加入</button>
        </div>
        <div class="control-group">
            <select id="removeOptionSelect"></select>
            <button class="action-btn" onclick="removeOption()">移除</button>
        </div>
    </div>

    <div class="data-display" id="dataDisplay"></div>

    <button class="spin-btn" onclick="executeSpin()">開始旋轉</button>
    
    <div id="wheel-container">
        <div id="pointer"></div>
        <canvas id="wheelCanvas" width="760" height="760" style="width: 380px; height: 380px;"></canvas>
    </div>
    
    <div id="resultText"></div>

    <script>
        const STORAGE_KEY = 'minimalist_wheel_options';
        const DEFAULT_OPTIONS = ["小高", "MDD", "藏壽司", "麥當勞"];
        const COLOR_PALETTE = ['#FFB3BA', '#FFDFBA', '#FFFFBA', '#B5EAD7', '#C7CEEA', '#E2F0CB'];

        let currentOptions = [];
        let accumulatedRotation = 0;
        let isSpinning = false;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const resultTextElement = document.getElementById('resultText');
        const newOptionInput = document.getElementById('newOptionInput');
        const removeOptionSelect = document.getElementById('removeOptionSelect');
        const dataDisplay = document.getElementById('dataDisplay');

        function initializeApp() {
            const storedData = localStorage.getItem(STORAGE_KEY);
            if (storedData) { currentOptions = JSON.parse(storedData); } 
            else { currentOptions = [...DEFAULT_OPTIONS]; }
            updateInterface();
        }

        function persistOptions() { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentOptions)); }

        function updateInterface() {
            removeOptionSelect.innerHTML = '';
            currentOptions.forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.value = option; optionElement.textContent = option;
                removeOptionSelect.appendChild(optionElement);
            });
            dataDisplay.textContent = `目前選項 (${currentOptions.length})： ${currentOptions.join(" 、 ")}`;
            renderWheel();
        }

        function addOption() {
            if (isSpinning) return;
            const newValue = newOptionInput.value.trim();
            if (newValue && !currentOptions.includes(newValue)) {
                currentOptions.push(newValue);
                newOptionInput.value = '';
                persistOptions(); updateInterface();
            }
        }

        function removeOption() {
            if (isSpinning) return;
            const targetValue = removeOptionSelect.value;
            if (targetValue) {
                currentOptions = currentOptions.filter(option => option !== targetValue);
                persistOptions(); updateInterface();
            }
        }

        function renderWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const totalItems = currentOptions.length;
            
            if (totalItems === 0) {
                ctx.fillStyle = '#F8FAFC'; ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, canvas.width / 2, 0, 2 * Math.PI);
                ctx.fill(); return;
            }

            const arcRadian = (2 * Math.PI) / totalItems;
            const centerX = canvas.width / 2; const centerY = canvas.height / 2;
            const wheelRadius = centerX;

            for (let i = 0; i < totalItems; i++) {
                const startAngle = i * arcRadian - (Math.PI / 2) - (arcRadian / 2);
                const endAngle = startAngle + arcRadian;
                
                ctx.beginPath(); ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, wheelRadius, startAngle, endAngle);
                ctx.fillStyle = COLOR_PALETTE[i % COLOR_PALETTE.length]; ctx.fill();
                
                ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 6; ctx.stroke();
                
                ctx.save(); ctx.translate(centerX, centerY); ctx.rotate(startAngle + arcRadian / 2);
                ctx.textAlign = "right"; ctx.fillStyle = "#2C3E50"; 
                ctx.font = "bold 36px 'Noto Sans TC', sans-serif"; 
                ctx.fillText(currentOptions[i], wheelRadius - 40, 12);
                ctx.restore();
            }
        }

        function executeSpin() {
            if (isSpinning || currentOptions.length === 0) return;
            isSpinning = true; resultTextElement.innerText = "旋轉中...";
            
            const baseSpins = (Math.floor(Math.random() * 6) + 5) * 360;
            const randomAngleOffset = Math.floor(Math.random() * 360);
            accumulatedRotation += baseSpins + randomAngleOffset;
            
            canvas.style.transform = `rotate(${accumulatedRotation}deg)`;
            
            setTimeout(() => {
                const sliceDegree = 360 / currentOptions.length;
                const relativeAngle = (360 - (accumulatedRotation % 360)) % 360;
                const shiftedAngle = (relativeAngle + sliceDegree / 2) % 360;
                const winningIndex = Math.floor(shiftedAngle / sliceDegree);
                
                resultTextElement.innerText = "🎉 決定吃：" + currentOptions[winningIndex] + "！";
                isSpinning = false;
            }, 4000);
        }

        document.fonts.ready.then(() => { initializeApp(); });
        newOptionInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') addOption(); });
    </script>
</body>
</html>
